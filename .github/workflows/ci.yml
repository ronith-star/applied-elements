# Continuous integration for the Applied Elements platform.
#
# Runs on every push and pull request. The job deliberately does NOT install
# the package in editable mode before the first pytest invocation: for
# twenty-five commits the suite passed only because an editable install
# happened to exist in one development environment, and a fresh clone would
# have failed on `import ae`. tests/conftest.py now puts src/ on sys.path, and
# the "no editable install" step below is what keeps that true, by running the
# suite exactly as someone who has just cloned the repository would.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 run on Node 24. The v4/v5 pair emitted a deprecation warning
      # that GitHub was already force-migrating, so the pin is to the version
      # that actually runs rather than the one that warns.
      # fetch-depth 0 because tests/test_corrections_record.py resolves the
      # commit hashes that docs/CORRECTIONS.md cites. The default shallow
      # clone has only HEAD, so every historical hash was absent and the test
      # failed, which is what turned run #5 red. The audit needs the history
      # it audits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib sympy pint \
            SALib simpy PuLP scikit-learn xgboost openpyxl XlsxWriter \
            pydantic PyKrige pytest mypy ruff

      # THE GATE. Runs BEFORE any install of this package, which proves a
      # fresh clone works. Covers every physics, plant, economics and ML
      # model plus the golden vectors and literature benchmarks. A failure
      # here means a model is wrong and the build must go red.
      # The prose audit (docstring numbers asserted, citations resolved,
      # arithmetic reproduced) is INSIDE the gate. It began as a pinned
      # non-fatal step with a measured ceiling of 148 failures while three
      # agent tracks worked the backlog down; at zero, per the rule recorded
      # here at the time, the step was deleted and the three files joined the
      # fatal suite. A new unasserted number, unresolved citation, or
      # unreproduced arithmetic claim now goes red like a model error.
      - name: Model suite and documentation audit (fatal)
        run: |
          python -m pytest tests/ -q

      # Lint and type errors are reported but NOT fatal, and the reason is
      # recorded rather than left as a silent `|| true`. At the time this
      # workflow was added the tree carried 54 ruff findings and 66 mypy
      # errors. The mypy remainder is annotation friction against untyped
      # third-party returns (scipy.stats.ppf and pint arithmetic return Any,
      # which strict mode reports at every typed boundary), not logic defects:
      # the one error class that WAS a real defect, 477 errors from binding
      # Quantity to UREG.Quantity, is fixed. Making these fatal today would
      # mean a permanently red badge that stops carrying information, so they
      # are surfaced for reading and the suite is the gate. Tighten to fatal
      # once the counts reach zero.
      - name: Lint (advisory, prints findings)
        run: ruff check src tests || true

      - name: Type check (advisory, prints findings)
        run: mypy src || true

      # Doctests ARE fatal: a worked example in a docstring that no longer
      # reproduces is a wrong claim in the documentation, not style friction.
      - name: Doctests in modules
        run: python -m pytest --doctest-modules src/ae -q

      - name: Export the parameter registry and validation record
        run: |
          python scripts/export_registry.py
          python scripts/export_validation.py

      - name: Upload registry and validation artefacts
        uses: actions/upload-artifact@v4
        with:
          name: registry-and-validation
          path: data/registry/*.csv
