id: GV-12
kind: golden
title: Conversion at a fixed dimensionless time in three regimes, with the g(X) round trip
check: leach_conversion
derivation: independent
module: ae.physics.leaching
reference: >
  Levenspiel, O. 1999, Chemical Reaction Engineering, 3rd edition, Wiley, chapter 25.
  The three g(X) forms are that chapter's; the closed-form inversion of the cubic
  product-layer case by the trigonometric method is standard for a depressed cubic
  with three real roots.
inputs:
  t_over_tau: 0.875
  conversion_x: 0.80
provenance:
  t_over_tau: >
    ASSUMED, 0.875 = 7/8, chosen because it makes the surface-reaction
    inversion exact in binary arithmetic: 1 - 0.875 = 0.125 = 1/8 and its cube is
    exactly 1/512. A dimensionless time was chosen instead of a time and a tau so
    that this vector tests the conversion relations alone, with GV-11 testing tau.
  conversion_x: >
    ASSUMED, 0.80, a separate point at which the three g(X) functions are
    evaluated forward. 0.80 is deliberately NOT the inverse image of 0.875 in any
    regime, so the forward and inverse halves of the vector cannot cancel a shared
    error.
arithmetic: |
  Film diffusion, g(X) = X, so X(theta) = theta:
    X_film = 0.875
  Surface reaction, g(X) = 1 - (1-X)^(1/3), inverted as X = 1 - (1 - theta)^3:
    1 - 0.875 = 0.125
    0.125^3 = 0.001953125 exactly (1/512)
    X_sr = 1 - 0.001953125 = 0.998046875
  Product layer, g(X) = 1 - 3(1-X)^(2/3) + 2(1-X). Substituting u = (1-X)^(1/3)
  gives 2u^3 - 3u^2 + 1 - theta = 0, a cubic with three real roots, of which the
  physical one lies in [0,1] and is obtained by the trigonometric formula:
    phi = arccos(2 theta - 1) = arccos(0.75) = 0.7227342478134157 rad
    u = 0.5 + cos(phi/3 + 4 pi/3)
      phi/3 = 0.24091141593780524
      4 pi/3 = 4.188790204786391
      sum = 4.429701620724196 rad
      cos(4.429701620724196) = -0.27893734916576235
      u = 0.5 - 0.27893734916576235 = 0.22106265083423765
    X_pl = 1 - u^3 = 1 - 0.010803043390790... = 0.9891969566092098
  Round trip: feeding each X back through the module's own g(X) must return 0.875.
  By hand for the surface-reaction case: 1 - (0.001953125)^(1/3) = 1 - 0.125 = 0.875.
  Forward evaluation of g at X = 0.80, where 1 - X = 0.2:
    film:    g = 0.80
    surface: g = 1 - 0.2^(1/3) = 1 - 0.5848035476425733 = 0.4151964523574267
    product: g = 1 - 3*0.2^(2/3) + 2*0.2
               = 1 - 3*0.34199518933533946 + 0.4
               = 1 - 1.0259855680060184 + 0.4 = 0.3740144319939818
  The three forward values differ by a factor of two, which is why a vector that
  used only one of them could not distinguish the regimes.
expected:
  x_film: 0.875
  x_surface_reaction: 0.998046875
  x_product_layer: 0.9891969566
  g_round_trip_film: 0.875
  g_round_trip_surface_reaction: 0.875
  g_round_trip_product_layer: 0.875
  g_at_x_film: 0.80
  g_at_x_surface_reaction: 0.41519645235742675
  g_at_x_product_layer: 0.37401443199398166
tolerances:
  x_film:
    abs: 0.0
    reason: >
      The identity X = theta, one assignment of an exactly representable value
      (7/8), so equality is the correct test and any tolerance would be a fudge
      factor.
  x_surface_reaction:
    abs: 0.0
    reason: >
      Every operand is a dyadic rational: 1 - 0.875 = 0.125 and 0.125^3 = 1/512
      are both exact in binary floating point, as is the final subtraction from
      1. The input was chosen for exactly this reason, so equality is the
      correct test.
  x_product_layer:
    abs: 1.0e-09
    reason: >
      One arccos, one cosine, one cube. Transcendental functions are accurate to
      about 1 ulp, and the cosine is evaluated at an argument near 4.43 rad
      where its derivative is about 0.96, so no catastrophic amplification
      occurs. The propagated bound is near 1e-15. 1e-9 admits it with six orders
      of margin. Deliberately looser than the surface-reaction tolerance because
      the trigonometric route genuinely carries transcendental rounding while
      the dyadic route does not.
  g_round_trip_film:
    abs: 1.0e-12
    reason: >
      An identity mapping composed with itself, exact but routed through numpy
      array conversion, so 1e-12 admits any ulp-level difference.
  g_round_trip_surface_reaction:
    abs: 1.0e-12
    reason: >
      The forward g is a separate function from the inversion, so this is a real
      cross-check. The cube root of an exact 1/512 is exactly 0.125, so the
      round trip is exact to 1 ulp, near 1e-16.
  g_round_trip_product_layer:
    abs: 1.0e-12
    reason: >
      Measured in this session: substituting the trigonometric root back into g
      returned 0.8749999999999997, an error of 3e-16 against the target 0.875.
      The error arises from the two fractional powers in g. 1e-12 admits the
      measured 3e-16 with three orders of margin and would still catch a wrong
      coefficient in the cubic, which shifts g by order 0.1.
  g_at_x_film:
    abs: 1.0e-12
    reason: >
      The identity g = X on an exactly representable 0.8 input rounded once, so
      at most 1 ulp near 1e-17. 1e-12 admits that with five orders of margin.
  g_at_x_surface_reaction:
    abs: 1.0e-12
    reason: >
      One cube root and one subtraction. The cube root of 0.2 carries 1 ulp near
      6e-17; the subtraction from 1 leaves an absolute error near 1e-16. 1e-12
      admits it with four orders of margin.
  g_at_x_product_layer:
    abs: 1.0e-12
    reason: >
      Two fractional powers of 0.2 and two additions, so the bound is a few ulp
      near 3e-16. 1e-12 admits it. The coefficients 3 and 2 are the substance:
      dropping the 2(1-X) term gives -0.0259856, a sign change, detected
      immediately.
