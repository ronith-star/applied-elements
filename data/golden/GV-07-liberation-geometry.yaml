id: GV-07
kind: golden
title: Inclusion exposure, enclosed fraction and the liberation size that follows
check: liberation_geometry
derivation: independent
module: ae.physics.liberation
reference: >
  Gaudin, A.M. 1939, Principles of Mineral Dressing, McGraw-Hill, chapter on
  liberation by size reduction. The cubic random-fracture form used here is the
  standard geometric idealisation and is labelled as such in the module.
inputs:
  particle_size_um: 75.0
  inclusion_size_um: 15.0
  target_exposure: 0.60
provenance:
  particle_size_um: ASSUMED, 75 um, the 200 mesh aperture, a common grind target.
  inclusion_size_um: ASSUMED, 15 um, a mineral inclusion size. Not a measurement on
    Vikarabad ore; no inclusion size distribution for that deposit exists in the
    citable record.
  target_exposure: ASSUMED, 0.60, a design exposure target.
arithmetic: |
  ratio r = d_i/d_p = 15/75 = 0.2 exactly.
  Enclosed fraction = (1 - r)^3 = 0.8^3 = 64/125 = 0.512 exactly as a rational.
  In double precision 0.8 is not exactly representable and the cube evaluates to
  0.5120000000000001, so the exposure evaluates to 0.4879999999999999.
  Exposure = 1 - 0.512 = 0.488
  Closure: 0.512 + 0.488 = 1 exactly, which is the identity this vector pins.
  Liberation size for a target exposure E* = 0.60:
    d_p = d_i / (1 - (1 - E*)^(1/3))
    (1 - 0.60) = 0.4
    0.4^(1/3) = 0.7368062997280773
    1 - 0.7368062997280773 = 0.2631937002719227
    d_p = 15 / 0.2631937002719227 = 56.992245576176465 um
  Direction check by hand: a 56.9922 um particle has r = 15/56.9922 = 0.2631937, so
  (1 - 0.2631937)^3 = 0.4 and exposure 1 - 0.4 = 0.6, as required.
expected:
  enclosed_fraction: 0.512
  exposure: 0.488
  closure: 1.0
  liberation_size_um: 56.9922455762
tolerances:
  enclosed_fraction:
    abs: 1.0e-12
    reason: >
      0.2 and 0.8 are not binary-exact, so one cube of a rounded value
      introduces a relative error near 3e-16, which is 1.5e-16 absolute at
      0.512. 1e-12 admits that with four orders of margin. A squared rather than
      cubed form gives 0.64, detected by 0.128.
  exposure:
    abs: 1.0e-12
    reason: >
      One subtraction of the enclosed fraction from 1, so the bound is the
      enclosed fraction's own error of about 2e-16 plus one rounding. 1e-12
      admits that with four orders of margin.
  closure:
    abs: 1.0e-12
    reason: >
      The two outputs are computed by separate module functions rather than one
      from the other, so their sum being 1 is a real cross-check and not an
      identity of the arithmetic. Two values each carrying at most 2e-16 sum to
      at most 4e-16 of error. 1e-12 admits it and would catch any definitional
      mismatch, which would show as a discrepancy of order 0.1.
  liberation_size_um:
    abs: 1.0e-06
    reason: >
      One cube root and one division. The cube root of 0.4 carries about 1 ulp,
      so the relative error in the divisor near 0.263 is about 6e-16, giving
      3.4e-14 um at 57 um. 1e-6 um admits that with eight orders of margin. A
      square root in place of the cube root gives 15/(1 - 0.632456) = 40.82 um,
      detected by 16 um.
