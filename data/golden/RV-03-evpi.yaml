id: RV-03
kind: regression
title: EVPI on a two-action problem whose closed-form answer is 1/16, showing the nested-Monte-Carlo bias
check: evpi
derivation: mixed
regression_reason: >
  The EVPI of this problem has an exact closed form, 1/16 = 0.0625, derived below
  with a calculator. The value the module returns does NOT equal it and cannot be
  expected to: it is a Monte Carlo estimate at a finite outer sample. The expected
  value in this file is therefore the MEASURED value at a stated seed and sample
  size, so the file is a REGRESSION vector. The closed form is carried alongside as
  analytic_reference and the test checks the seeded value against the pin AND the
  deviation against its derived standard error, which is the part that tests the
  model rather than the snapshot.
  THIS VECTOR HAS ALREADY DONE ITS JOB ONCE. The pins first recorded here were
  measured against a version of ae.agent.decisions in which the baseline was drawn
  from an INDEPENDENT sample (problem.best_action_now()), so the difference
  resolved minus baseline did not cancel the two terms' common sampling error.
  Commit baadddf paired both terms on the same outer and inner draws (common random
  numbers). This vector failed on that commit, with evpi moving from
  0.06732450807636592 to 0.064788758648048 and baseline_value from
  0.4928314937557836 to 0.4953672431841015, which is exactly what a regression
  vector is for. The pins below are the paired estimator's, and the error model in
  the arithmetic chain was re-derived for the paired estimator rather than rescaled.
module: ae.agent.decisions
reference: >
  Howard, R.A. 1966, Information Value Theory, IEEE Transactions on Systems Science
  and Cybernetics 2(1):22-26, doi:10.1109/TSSC.1966.300074, verified against Crossref
  in this repository's corrections record. Raiffa, H. and Schlaifer, R. 1961, Applied
  Statistical Decision Theory, Division of Research, Graduate School of Business
  Administration, Harvard University, for the decision-analytic framing.
inputs:
  theta_low: -0.5
  theta_high: 1.5
  actions:
    - {name: wait, cost: 0.0}
    - {name: build, cost: 0.0}
  null_action: wait
  n_outer: 2048
  n_inner: 256
  seed: 0
provenance:
  theta_low: >
    ASSUMED, -0.5. The parameter is the payoff of building, uniform on
    (-0.5, 1.5), so a quarter of the prior mass makes building the wrong choice.
    That fraction is what perfect information is worth.
  theta_high: >
    ASSUMED, 1.5.
  actions: >
    ASSUMED, two zero-cost actions: wait, which always pays zero, and build,
    which pays theta. Zero action costs keep the closed form clean.
  n_outer: >
    ASSUMED, 2048 outer draws.
  n_inner: >
    ASSUMED, 256 inner draws. There is no remaining uncertainty in this
    problem once theta is resolved, so the inner loop averages a constant and the
    usual upward bias from taking a maximum over noisy inner estimates does NOT
    arise here. That is deliberate: it isolates the outer-loop sampling error, and
    it is confirmed by measurement below (raising n_inner eightfold moves the
    estimate by 2.2e-16).
  seed: >
    ASSUMED, 0.
arithmetic: |
  Prior expectations. Waiting always pays 0. Building pays theta, so
    E[build] = (low + high)/2 = (-0.5 + 1.5)/2 = 0.5
  The best action under the prior is therefore build, with value 0.5.
  With perfect information the decision maker builds when theta > 0 and waits
  otherwise, so the value is E[max(0, theta)]:
    E[max(0, theta)] = (1/(high - low)) * integral from 0 to 1.5 of theta dtheta
                     = (1/2) * (1.5^2/2) = (1/2) * 1.125 = 0.5625
  EVPI = 0.5625 - 0.5 = 0.0625 = 1/16 exactly.
  Switch fraction. Perfect information changes the action exactly when theta < 0,
  which has probability (0 - (-0.5))/2 = 0.25.
  Sampling error of the PAIRED estimator. The module accumulates both terms over
  the same outer and inner draws, so the estimator on one outer sample of size n is
    (1/n) sum_i max(0, theta_i)  -  max(0, (1/n) sum_i theta_i)
  At these sample sizes the sample mean of theta is positive with overwhelming
  probability, so the second term IS that sample mean and the whole estimator
  collapses to a single sample mean of a single per-draw quantity:
    (1/n) sum_i [ max(0, theta_i) - theta_i ]  =  (1/n) sum_i max(0, -theta_i)
  That identity is the reason the pairing works, and it changes the error model
  completely: one sample mean of a bounded quantity, not a difference of two
  independently estimated means.
  Check that this route gives the same expectation:
    E[max(0, -theta)] = (1/2) * integral from 0 to 0.5 of u du = (1/2)*(0.25/2)
                      = 0.0625 = 1/16, which equals 0.5625 - 0.5 exactly.
  Variance of the per-draw quantity:
    E[max(0,-theta)^2] = (1/2) * (0.5^3/3) = (1/2)*(0.041666666666666664)
                       = 1/48 = 0.020833333333333332
    Var = 1/48 - (1/16)^2 = 0.020833333333333332 - 0.00390625
        = 13/768 = 0.016927083333333332
    sd  = sqrt(0.016927083333333332) = 0.1301041249666333
    SE at n_outer = 2048: 0.1301041249666333/sqrt(2048) = 0.0028749221570077625
  So the estimator should land within about 3 paired SE, 0.008624766471023287, of
  0.0625. That bound is 4.94 times tighter than the 0.014196590161039404 combined
  SE the unpaired estimator carried, which is the measurable benefit of the
  pairing.
  MEASURED at seed 0, n_outer = 2048, n_inner = 256:
    evpi = 0.064788758648048
    baseline_value = 0.4953672431841015 (against the true 0.5)
    resolved_value = 0.5601560018321495 (against the true 0.5625)
    switch_fraction = 0.2548828125 (against the true 0.25)
  The deviation of the EVPI estimate from 1/16 is +0.002288758648048006, which is
  0.7961115199133464 of a paired SE. The resolved value is unchanged by the pairing
  (it never depended on the baseline sample) and sits 0.0023439981678504695 below
  0.5625. The baseline is now the paired baseline and differs from
  problem.best_action_now() by sampling error, which the module's own docstring
  states.
  Seed dependence, measured at n_outer = 2048, n_inner = 256: seed 0 gave
  0.064788758648048, seed 1 gave 0.06050028280768449, seed 2 gave
  0.06424372728470101, seed 3 gave 0.06698210459519677, seed 4 gave
  0.06256202694851598. Per-seed deviations from 1/16 in paired SE units: 0.7961,
  -0.6956, 0.6065, 1.5590, 0.0216. The spread of 0.006481821787512276 is 2.25
  paired SE, and the values straddle 0.0625, which confirms sampling error rather
  than bias.
  Inner-sample independence check: at n_outer = 2048 with n_inner raised from 256 to
  2048 the measured EVPI was 0.06478875864804778 against 0.064788758648048, a
  difference of 2.220446049250313e-16. That confirms the claim in the provenance
  that the inner loop averages a constant in this problem, so no upward nesting
  bias is present and the entire deviation from 1/16 is outer-loop sampling error.
inputs_note: >
  The switch fraction is reported by the module as the fraction of outer draws on
  which perfect information would change the action, and its true value 0.25 is
  known exactly, so it is the sharpest statistical check available in this file.
expected:
  evpi: 0.064788758648048
  baseline_value: 0.4953672431841015
  resolved_value: 0.5601560018321495
  switch_fraction: 0.2548828125
analytic_reference:
  evpi: 0.0625
  baseline_value: 0.5
  resolved_value: 0.5625
  switch_fraction: 0.25
  paired_per_draw_variance: 0.016927083333333332
  paired_per_draw_sd: 0.1301041249666333
  paired_standard_error: 0.0028749221570077625
  superseded_unpaired_combined_standard_error: 0.014196590161039404
tolerances:
  evpi:
    abs: 1.0e-12
    reason: >
      A REGRESSION pin. The seed fixes the sample, so the value is deterministic
      to floating point on the same numpy version, and 1e-12 admits summation-
      order differences across platforms. This tolerance makes NO claim about
      statistical accuracy: the 0.0028749221570077625 paired standard error in
      analytic_reference is the honest uncertainty, and the test separately
      checks that the measured value lies within 3 of those of the closed-form
      1/16. This pin has already caught one real change, commit baadddf pairing
      the baseline with the resolved sample, which moved the value by
      0.0025357494283179127.
  baseline_value:
    abs: 1.0e-12
    reason: >
      A seeded regression pin, with the same floating point basis as evpi. This
      is the PAIRED baseline, accumulated over the same draws as the resolved
      value, so it is not the same quantity as problem.best_action_now() and
      differs from it by sampling error. Its deviation from the true 0.5 is
      -0.0046327568158985 at this seed, and the pairing means that deviation is
      correlated with the resolved value's, which is why their difference is
      tighter than either.
  resolved_value:
    abs: 1.0e-12
    reason: >
      A seeded regression pin, with the same floating point basis as evpi. This
      output is unchanged by the pairing commit, because it never depended on
      the baseline sample: its own standard error against the true 0.5625 is
      sqrt(0.24609375/2048) = 0.010961886875314282, and the measured value sits
      0.0023439981678504695 below, which is 0.21 of that.
  switch_fraction:
    abs: 1.0e-12
    reason: >
      A seeded regression pin on a ratio of integers (switches over n_outer), so
      it is exactly representable and reproduces bit for bit. The statistical
      check against the true 0.25 uses the binomial standard error
      sqrt(0.25*0.75/2048) = 0.009568319307746789, which the test applies
      separately.
